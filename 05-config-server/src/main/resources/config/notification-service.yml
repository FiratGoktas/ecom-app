spring:
  cloud:
    function:
      definition: orderCreated
    stream:
      function:
        definition: orderCreated
      bindings:
        orderCreated-in-0:
          destination: order.exchange
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include:
          - bus-refresh
          - shutdown
          - health
          - info
          - metrics
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  register-with-eureka: true
  fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
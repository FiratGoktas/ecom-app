<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order confirmation</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #222;">
<p>Hi <span th:text="${order.userFirstName != null ? order.userFirstName : 'there'}">Customer</span>,</p>

<p>Thanks for your order! Here are the details.</p>

<table style="border-collapse: collapse; margin-bottom: 16px;">
    <tr><td style="padding: 2px 12px 2px 0;"><strong>Order</strong></td><td th:text="'#' + ${order.orderId}">#1</td></tr>
    <tr><td style="padding: 2px 12px 2px 0;"><strong>Status</strong></td><td th:text="${order.orderStatus}">CONFIRMED</td></tr>
    <tr th:if="${order.createdAt != null}">
        <td style="padding: 2px 12px 2px 0;"><strong>Date</strong></td>
        <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
    </tr>
</table>

<table style="border-collapse: collapse; width: 100%; max-width: 560px;">
    <thead>
    <tr style="background: #f2f2f2;">
        <th style="text-align: left; padding: 6px; border: 1px solid #ddd;">Product ID</th>
        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Qty</th>
        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Price</th>
        <th style="text-align: right; padding: 6px; border: 1px solid #ddd;">Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${order.items}">
        <td style="padding: 6px; border: 1px solid #ddd;" th:text="${item.product_id}">1</td>
        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;" th:text="${item.quantity}">1</td>
        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;" th:text="${item.price}">10.00</td>
        <td style="text-align: right; padding: 6px; border: 1px solid #ddd;" th:text="${item.subtotal}">10.00</td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td colspan="3" style="text-align: right; padding: 6px;"><strong>Total</strong></td>
        <td style="text-align: right; padding: 6px;"><strong th:text="${order.totalAmount}">10.00</strong></td>
    </tr>
    </tfoot>
</table>

<p style="color: #777; font-size: 12px; margin-top: 24px;">This is an automated message, please do not reply.</p>
</body>
</html>
